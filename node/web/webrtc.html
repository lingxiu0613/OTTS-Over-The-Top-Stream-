<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTTS WebRTC Console</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --surface: #f8fafc;
        --line: #d7dee9;
        --text: #111827;
        --muted: #667085;
        --blue: #2563eb;
        --ok: #16a34a;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        max-width: 1480px;
        margin: 0 auto;
        padding: 20px 18px 48px;
      }

      .hero,
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px 20px;
        margin-bottom: 16px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
      }

      .hero {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }

      h1,
      h2 {
        margin: 0 0 14px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      h1 {
        font-size: 30px;
      }

      h2 {
        font-size: 22px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .hero {
          display: block;
        }
      }

      input,
      button,
      pre,
      video {
        width: 100%;
        box-sizing: border-box;
        border-radius: 6px;
      }

      input {
        padding: 10px 12px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--text);
        overflow-wrap: anywhere;
      }

      button {
        border: 0;
        padding: 10px 12px;
        background: var(--blue);
        color: white;
        cursor: pointer;
        margin-top: 8px;
        font-weight: 600;
      }

      button.secondary {
        background: #eef2f7;
        color: var(--text);
        border: 1px solid var(--line);
      }

      video {
        background: #000;
        min-height: 240px;
        margin-top: 12px;
        border: 1px solid var(--line);
      }

      pre {
        margin: 0;
        min-height: 180px;
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--line);
        background: #0f172a;
        color: #e5e7eb;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .muted {
        color: var(--muted);
      }

      a {
        color: #1d4ed8;
      }

      .field-label {
        display: block;
        margin: 8px 0 6px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <div>
          <h1>OTTS WebRTC 测试台</h1>
          <p class="muted">WHIP 推流、WHEP 播放和浏览器会话调试。</p>
          <p class="muted" id="securityHint"></p>
        </div>
        <p><a href="/">返回管理控制台</a></p>
      </div>

      <div class="grid">
        <div class="card">
          <h2>WHIP Publish</h2>
          <label class="field-label" for="whipStreamKey">Publish Stream Key</label>
          <p><input id="whipStreamKey" value="live/webrtc-demo" /></p>
          <label class="field-label" for="whipPublishUrl">WHIP Publish URL</label>
          <p><input id="whipPublishUrl" value="" /></p>
          <button id="startPublish">Start WHIP Publish</button>
          <button id="stopPublish" class="secondary">Stop Publish</button>
          <video id="localVideo" autoplay muted playsinline></video>
          <p class="muted" id="publishStatus">Idle</p>
        </div>

        <div class="card">
          <h2>WHEP Play</h2>
          <label class="field-label" for="whepStreamKey">Play Stream Key</label>
          <p><input id="whepStreamKey" value="live/webrtc-demo" /></p>
          <label class="field-label" for="whepPlayUrl">WHEP Play URL</label>
          <p><input id="whepPlayUrl" value="" /></p>
          <button id="startPlay">Start WHEP Play</button>
          <button id="stopPlay" class="secondary">Stop Play</button>
          <video id="remoteVideo" autoplay playsinline controls></video>
          <p class="muted" id="playStatus">Idle</p>
        </div>
      </div>

      <div class="card">
        <h2>Session Log</h2>
        <pre id="log"></pre>
      </div>
    </main>

    <script>
      const proxyBase = window.location.origin;
      const logBox = document.getElementById("log");
      const whipStreamKeyInput = document.getElementById("whipStreamKey");
      const whepStreamKeyInput = document.getElementById("whepStreamKey");
      const whipPublishUrlInput = document.getElementById("whipPublishUrl");
      const whepPlayUrlInput = document.getElementById("whepPlayUrl");

      let publishPc = null;
      let publishStream = null;
      let publishSessionUrl = null;

      let playPc = null;
      let playStream = null;
      let playSessionUrl = null;
      let nativeRuntime = null;

      function updateSecurityHint() {
        const hint = document.getElementById("securityHint");
        const hasMediaApi = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
        if (window.isSecureContext && hasMediaApi) {
          hint.textContent = "Secure context ready. Browser WHIP publish should be allowed.";
          return;
        }
        hint.textContent =
          "This page is not running in a secure browser context. For WHIP publish from the browser, use HTTPS or open it from localhost on the Ubuntu machine.";
      }

      function log(message, data) {
        const line = `[${new Date().toLocaleTimeString()}] ${message}`;
        const payload = data ? `\n${JSON.stringify(data, null, 2)}` : "";
        logBox.textContent = `${line}${payload}\n\n${logBox.textContent}`;
      }

      function isNativeRuntime() {
        return nativeRuntime && nativeRuntime.selected_runtime === "native";
      }

      async function ensureRuntimeStatus() {
        if (!nativeRuntime) {
          await loadRuntimeStatus();
        }
        return nativeRuntime;
      }

      async function loadRuntimeStatus() {
        try {
          const response = await fetch(`${proxyBase}/api/webrtc/native`, { cache: "no-store" });
          if (!response.ok) {
            return;
          }
          nativeRuntime = await response.json();
          const runtime = isNativeRuntime() ? "native video" : "gateway";
          log("WebRTC runtime detected", { runtime, detail: nativeRuntime.detail });
          syncPlayUrl();
        } catch (error) {
          log("WebRTC runtime check failed", { error: error.message });
        }
      }

      function preferH264(transceiver) {
        if (!transceiver || typeof transceiver.setCodecPreferences !== "function") {
          return;
        }
        const capabilities = RTCRtpSender.getCapabilities?.("video");
        if (!capabilities || !Array.isArray(capabilities.codecs)) {
          return;
        }
        const h264 = capabilities.codecs.filter((codec) => /^video\/h264$/i.test(codec.mimeType));
        if (!h264.length) {
          return;
        }
        const rest = capabilities.codecs.filter((codec) => !/^video\/h264$/i.test(codec.mimeType));
        transceiver.setCodecPreferences([...h264, ...rest]);
      }

      function buildWhipUrl(streamKey) {
        return `${proxyBase}/whip/v1?stream_key=${encodeURIComponent(streamKey)}`;
      }

      function buildWhepUrl(streamKey) {
        return `${proxyBase}/whep/v1?stream_key=${encodeURIComponent(streamKey)}`;
      }

      function buildNativeWhepOfferUrl(streamKey) {
        return `${proxyBase}/whep/offer/v1?stream_key=${encodeURIComponent(streamKey)}`;
      }

      function normalizeWebRtcUrl(rawUrl, fallbackUrl) {
        const candidate = (rawUrl || "").trim();
        if (!candidate) {
          return fallbackUrl;
        }

        let parsed;
        try {
          parsed = new URL(candidate, window.location.origin);
        } catch (_error) {
          return candidate;
        }

        if (
          window.location.protocol === "https:" &&
          parsed.protocol === "http:" &&
          parsed.hostname === window.location.hostname &&
          parsed.pathname.startsWith("/rtc/v1/")
        ) {
          return `${window.location.origin}${parsed.pathname}${parsed.search}`;
        }

        return parsed.toString();
      }

      function streamKeyFromWebRtcUrl(rawUrl, fallbackStreamKey) {
        const candidate = (rawUrl || "").trim();
        if (!candidate) {
          return fallbackStreamKey;
        }
        let parsed;
        try {
          parsed = new URL(candidate, window.location.origin);
        } catch (_error) {
          return fallbackStreamKey;
        }

        const directKey = parsed.searchParams.get("stream_key");
        if (directKey) {
          return directKey;
        }
        const app = parsed.searchParams.get("app");
        const stream = parsed.searchParams.get("stream");
        if (app && stream) {
          return `${app}/${stream}`;
        }
        return fallbackStreamKey;
      }

      function syncPublishUrl() {
        const streamKey = whipStreamKeyInput.value.trim() || "live/webrtc-demo";
        whipPublishUrlInput.value = buildWhipUrl(streamKey);
      }

      function syncPlayUrl() {
        const streamKey = whepStreamKeyInput.value.trim() || "live/webrtc-demo";
        whepPlayUrlInput.value = isNativeRuntime() ? buildNativeWhepOfferUrl(streamKey) : buildWhepUrl(streamKey);
      }

      function getPublishTarget() {
        const inputStreamKey = whipStreamKeyInput.value.trim();
        const url = normalizeWebRtcUrl(
          whipPublishUrlInput.value,
          buildWhipUrl(inputStreamKey)
        );
        const streamKey = streamKeyFromWebRtcUrl(url, inputStreamKey);
        if (streamKey && streamKey !== inputStreamKey) {
          whipStreamKeyInput.value = streamKey;
          syncPublishUrl();
        }
        return { streamKey, url };
      }

      function getPlayTarget() {
        const inputStreamKey = whepStreamKeyInput.value.trim();
        const url = normalizeWebRtcUrl(
          whepPlayUrlInput.value,
          buildWhepUrl(inputStreamKey)
        );
        const streamKey = streamKeyFromWebRtcUrl(url, inputStreamKey);
        if (streamKey && streamKey !== inputStreamKey) {
          whepStreamKeyInput.value = streamKey;
          syncPlayUrl();
        }
        return { streamKey, url };
      }

      async function waitIceComplete(pc, timeoutMs = 5000) {
        const started = Date.now();
        while (pc.iceGatheringState !== "complete" && Date.now() - started < timeoutMs) {
          await new Promise((resolve) => setTimeout(resolve, 100));
        }
      }

      async function startPublish() {
        const { streamKey, url } = getPublishTarget();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("getUserMedia unavailable in this browser context; use HTTPS or localhost");
        }
        const constraints = {
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30, max: 30 }
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        };
        publishStream = await navigator.mediaDevices.getUserMedia(constraints);
        document.getElementById("localVideo").srcObject = publishStream;

        publishPc = new RTCPeerConnection();
        const videoTrack = publishStream.getVideoTracks()[0];
        if (videoTrack) {
          const videoTransceiver = publishPc.addTransceiver(videoTrack, {
            direction: "sendonly",
            streams: [publishStream],
            sendEncodings: [{ maxBitrate: 2500000, maxFramerate: 30 }]
          });
          preferH264(videoTransceiver);
          const parameters = videoTransceiver.sender.getParameters();
          parameters.degradationPreference = "maintain-framerate";
          if (!parameters.encodings || !parameters.encodings.length) {
            parameters.encodings = [{}];
          }
          parameters.encodings[0].maxBitrate = 2500000;
          parameters.encodings[0].maxFramerate = 30;
          await videoTransceiver.sender.setParameters(parameters).catch(() => {});
        }
        publishStream.getAudioTracks().forEach((track) => publishPc.addTrack(track, publishStream));

        const offer = await publishPc.createOffer();
        await publishPc.setLocalDescription(offer);
        await waitIceComplete(publishPc);

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: publishPc.localDescription.sdp
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || `WHIP failed: ${response.status}`);
        }

        const answerSdp = await response.text();
        publishSessionUrl = response.headers.get("Location")
          ? `${proxyBase}${response.headers.get("Location")}`
          : null;

        await publishPc.setRemoteDescription({ type: "answer", sdp: answerSdp });
        document.getElementById("publishStatus").textContent = `Publishing to ${streamKey}`;
        log("WHIP publish established", { streamKey, url, sessionUrl: publishSessionUrl });
      }

      async function stopPublish() {
        if (publishSessionUrl) {
          await fetch(publishSessionUrl, { method: "DELETE" }).catch(() => {});
        }
        if (publishPc) {
          publishPc.close();
          publishPc = null;
        }
        if (publishStream) {
          publishStream.getTracks().forEach((track) => track.stop());
          publishStream = null;
        }
        document.getElementById("localVideo").srcObject = null;
        document.getElementById("publishStatus").textContent = "Stopped";
      }

      async function startPlay() {
        if (playPc || playSessionUrl) {
          await stopPlay();
        }
        const { streamKey, url } = getPlayTarget();
        playPc = new RTCPeerConnection();
        playStream = new MediaStream();
        const remoteVideo = document.getElementById("remoteVideo");
        remoteVideo.srcObject = playStream;
        document.getElementById("playStatus").textContent = "Starting...";

        playPc.ontrack = (event) => {
          if (playStream && !playStream.getTracks().some((track) => track.id === event.track.id)) {
            playStream.addTrack(event.track);
          }
          remoteVideo.play().catch(() => {});
        };

        await ensureRuntimeStatus();
        if (isNativeRuntime()) {
          const offerUrl = buildNativeWhepOfferUrl(streamKey);
          const offerResponse = await fetch(offerUrl, { method: "GET" });
          if (!offerResponse.ok) {
            const text = await offerResponse.text();
            throw new Error(text || `native WHEP offer failed: ${offerResponse.status}`);
          }
          const offerSdp = await offerResponse.text();
          const location = offerResponse.headers.get("Location");
          playSessionUrl = location ? `${proxyBase}${location}` : null;
          if (!playSessionUrl) {
            throw new Error("native WHEP offer did not return a session URL");
          }

          await playPc.setRemoteDescription({ type: "offer", sdp: offerSdp });
          const answer = await playPc.createAnswer();
          await playPc.setLocalDescription(answer);
          await waitIceComplete(playPc);

          const answerResponse = await fetch(`${playSessionUrl}/answer`, {
            method: "POST",
            headers: { "Content-Type": "application/sdp" },
            body: playPc.localDescription.sdp
          });
          if (!answerResponse.ok) {
            const text = await answerResponse.text();
            throw new Error(text || `native WHEP answer failed: ${answerResponse.status}`);
          }
          document.getElementById("playStatus").textContent = `Playing ${streamKey}`;
          log("Native WHEP playback established", { streamKey, offerUrl, sessionUrl: playSessionUrl });
          return;
        }

        preferH264(playPc.addTransceiver("video", { direction: "recvonly" }));
        playPc.addTransceiver("audio", { direction: "recvonly" });
        const offer = await playPc.createOffer();
        await playPc.setLocalDescription(offer);
        await waitIceComplete(playPc);

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: playPc.localDescription.sdp
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || `WHEP failed: ${response.status}`);
        }

        const answerSdp = await response.text();
        playSessionUrl = response.headers.get("Location")
          ? `${proxyBase}${response.headers.get("Location")}`
          : null;
        await playPc.setRemoteDescription({ type: "answer", sdp: answerSdp });
        document.getElementById("playStatus").textContent = `Playing ${streamKey}`;
        log("WHEP playback established", { streamKey, url, sessionUrl: playSessionUrl });
      }

      async function stopPlay() {
        if (playSessionUrl) {
          await fetch(playSessionUrl, { method: "DELETE" }).catch(() => {});
          playSessionUrl = null;
        }
        if (playPc) {
          playPc.close();
          playPc = null;
        }
        const remoteVideo = document.getElementById("remoteVideo");
        remoteVideo.pause();
        remoteVideo.srcObject = null;
        remoteVideo.removeAttribute("src");
        remoteVideo.load();
        playStream = null;
        document.getElementById("playStatus").textContent = "Stopped";
      }

      document.getElementById("startPublish").addEventListener("click", async () => {
        try {
          await startPublish();
        } catch (error) {
          document.getElementById("publishStatus").textContent = error.message;
          log("WHIP publish failed", { error: error.message });
        }
      });

      document.getElementById("stopPublish").addEventListener("click", stopPublish);

      document.getElementById("startPlay").addEventListener("click", async () => {
        try {
          await startPlay();
        } catch (error) {
          document.getElementById("playStatus").textContent = error.message;
          log("WHEP play failed", { error: error.message });
        }
      });

      document.getElementById("stopPlay").addEventListener("click", stopPlay);
      whipStreamKeyInput.addEventListener("input", syncPublishUrl);
      whepStreamKeyInput.addEventListener("input", syncPlayUrl);
      syncPublishUrl();
      syncPlayUrl();
      updateSecurityHint();
      loadRuntimeStatus();
    </script>
  </body>
</html>
